name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lua 정적 검사와 포맷 검사 (OS와 무관하므로 ubuntu에서 한 번만)
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: luacheck 설치
        run: sudo apt-get update && sudo apt-get install -y lua-check

      - name: luacheck
        run: luacheck init.lua lua ftplugin tests wezterm.lua

      - name: stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check .

  unix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck 준비
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: shellcheck
        run: shellcheck install.sh tests/*.sh

      - name: install.sh 테스트
        run: bash tests/install_sh_test.sh

      - name: 문서 테스트
        run: bash tests/docs_test.sh

      - name: 설치 (기본)
        run: ./install.sh --yes

      - name: PATH에 ~/.local/bin 추가
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lua spec
        run: bash tests/run_lua.sh

      - name: nvim 0.11 확인
        run: nvim --headless "+lua assert(vim.fn.has('nvim-0.11')==1)" +qa

      - name: treesitter 스모크
        run: nvim --headless tests/lua/paths_spec.lua "+luafile tests/treesitter_smoke.lua"

      - name: 시작 스모크
        run: nvim --headless tests/fixtures/smoke.c "+luafile tests/startup_smoke.lua"

      # headless에서는 자동 설치를 하지 않으므로 끝날 때까지 기다리는 MasonInstall로 설치한다
      - name: 디버그 어댑터 설치
        timeout-minutes: 5
        run: nvim --headless "+MasonInstall debugpy codelldb" +qa

      - name: Python 디버거 E2E
        timeout-minutes: 5
        run: nvim --headless tests/fixtures/dap/hello.py "+luafile tests/dap_e2e.lua"

      - name: C 디버거 E2E
        timeout-minutes: 5
        run: nvim --headless tests/fixtures/dap/hello.c "+luafile tests/dap_e2e.lua"

      # jdtls 1.62부터 Java 25가 있어야 실행된다 (setup-java가 JAVA_HOME도 맞춤)
      - name: JDK 25 준비
        if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # jdtls는 프로젝트를 불러오는 데 시간이 걸리므로 대기 상한을 늘린다
      - name: Java 디버거 E2E
        timeout-minutes: 10
        if: runner.os == 'Linux'
        env:
          DAP_E2E_TIMEOUT: "180000"
        run: |
          nvim --headless "+MasonInstall jdtls java-debug-adapter java-test" +qa
          nvim --headless tests/fixtures/dap/java/Hello.java "+luafile tests/dap_e2e.lua"

      - name: 설치 (go,lua 선택)
        if: runner.os == 'Linux'
        run: ./install.sh --yes --with go,lua

      # 창이 사라진 WezTerm에 다시 붙는 도메인(gui-<PID>)이 macOS 소켓 위치(~/.local/share/wezterm)에서 잡히는지 본다
      # 살아 있는 WezTerm 프로세스(mux 서버) PID로 소켓 이름의 파일을 만들고, 끝난 PID(99999)는 빠지는지 확인한다
      - name: wezterm.lua 다시 붙기 도메인 확인 (macOS, WezTerm 20240203)
        if: runner.os == 'macOS'
        run: |
          version=20240203-110809-5046fc22
          curl -fsSL -o "$RUNNER_TEMP/wezterm.zip" "https://github.com/wezterm/wezterm/releases/download/$version/WezTerm-macos-$version.zip"
          unzip -q "$RUNNER_TEMP/wezterm.zip" -d "$RUNNER_TEMP/wezterm"
          bin="$(dirname "$(find "$RUNNER_TEMP/wezterm" -type f -name wezterm-mux-server | head -n 1)")"
          "$bin/wezterm-mux-server" --daemonize
          sleep 2
          pid="$(pgrep -x wezterm-mux-server | head -n 1)"
          dir="$HOME/.local/share/wezterm"
          mkdir -p "$dir"
          touch "$dir/gui-sock-$pid" "$dir/gui-sock-99999"
          out="$("$bin/wezterm" --config-file tests/wezterm_probe.lua show-keys --lua 2>&1)"
          grep "DOMAIN" <<<"$out"
          grep -q "DOMAIN gui-$pid\$" <<<"$out" || { echo "gui-$pid 도메인 없음"; exit 1; }
          if grep -q "DOMAIN gui-99999" <<<"$out"; then echo "끝난 PID 도메인이 남음"; exit 1; fi

  # 창이 사라진 WezTerm에 다시 붙는 기능을 Linux에서 실제 창 두 개(Xvfb)로 확인 (로컬과 같은 WezTerm 버전)
  wezterm-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      - name: WezTerm 20240203·Xvfb 설치
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl xvfb procps libgl1-mesa-dri libegl1
          version=20240203-110809-5046fc22
          curl -fsSL -o /tmp/wezterm.deb \
            "https://github.com/wezterm/wezterm/releases/download/$version/wezterm-$version.Ubuntu22.04.deb"
          DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/wezterm.deb

      - name: 다시 붙기 E2E
        run: bash tests/wezterm_reattach_test.sh

  # Fedora(dnf), Arch(pacman)를 깨끗한 컨테이너에서 실제 설치로 검증
  distros:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 설치 (기본)
        run: ./install.sh --yes

      - name: PATH에 ~/.local/bin 추가
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lua spec
        run: bash tests/run_lua.sh

      - name: nvim 0.11 확인
        run: nvim --headless "+lua assert(vim.fn.has('nvim-0.11')==1)" +qa

      - name: treesitter 스모크
        run: nvim --headless tests/lua/paths_spec.lua "+luafile tests/treesitter_smoke.lua"

      - name: 시작 스모크
        run: nvim --headless tests/fixtures/smoke.c "+luafile tests/startup_smoke.lua"

      # headless에서는 자동 설치를 하지 않으므로 끝날 때까지 기다리는 MasonInstall로 설치한다
      - name: 디버그 어댑터 설치
        timeout-minutes: 5
        run: nvim --headless "+MasonInstall debugpy codelldb" +qa

      - name: Python 디버거 E2E
        timeout-minutes: 5
        run: nvim --headless tests/fixtures/dap/hello.py "+luafile tests/dap_e2e.lua"

      - name: C 디버거 E2E
        timeout-minutes: 5
        run: nvim --headless tests/fixtures/dap/hello.c "+luafile tests/dap_e2e.lua"

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Pester, PSScriptAnalyzer 설치
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Pester
        run: |
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path tests/install.Tests.ps1 -Output Detailed -CI

      - name: PSScriptAnalyzer
        run: |
          $results = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results) { throw "ScriptAnalyzer 결과 $(@($results).Count)건" }

      # 로컬과 같은 WezTerm 버전(설치 없는 zip)으로 wezterm.lua를 읽어 본다
      # 설정 오류가 있어도 기본 설정으로 대체되어 종료 코드가 0이므로 출력 내용으로 판단한다
      - name: wezterm.lua 로드 확인 (WezTerm 20240203)
        if: matrix.shell == 'pwsh'
        run: |
          $version = '20240203-110809-5046fc22'
          $zip = Join-Path $env:RUNNER_TEMP 'wezterm.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wezterm'
          Invoke-WebRequest "https://github.com/wezterm/wezterm/releases/download/$version/WezTerm-windows-$version.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter wezterm.exe | Select-Object -First 1
          $out = & $exe.FullName --config-file wezterm.lua show-keys --lua | Out-String
          if ($out -notmatch 'DetachDomain' -or $out -notmatch "mods = 'LEADER'") {
              Write-Output $out
              throw 'wezterm.lua를 읽지 못함 (DetachDomain 또는 LEADER 키 없음)'
          }
          # 창이 사라진 WezTerm에 다시 붙는 도메인(gui-<PID>)이 Windows 경로(\ 섞인 홈)에서 잡히는지 본다
          # 살아 있는 WezTerm 프로세스(mux 서버) PID로 소켓 이름의 파일을 만들고, 끝난 PID(99999)는 빠지는지 확인한다
          $mux = Start-Process (Join-Path $exe.DirectoryName 'wezterm-mux-server.exe') -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $sockets = Join-Path $HOME '.local\share\wezterm'
          New-Item -ItemType Directory -Force $sockets | Out-Null
          New-Item -ItemType File -Force (Join-Path $sockets "gui-sock-$($mux.Id)"), (Join-Path $sockets 'gui-sock-99999') | Out-Null
          # 도메인 로그는 stderr로 나온다. 2>&1은 네이티브 stderr를 오류 레코드로 바꾸므로 파일로 받는다
          $log = Join-Path $env:RUNNER_TEMP 'wezterm-probe.log'
          Start-Process $exe.FullName -ArgumentList '--config-file', 'tests/wezterm_probe.lua', 'show-keys', '--lua' `
              -RedirectStandardError $log -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'wezterm-probe.out') -NoNewWindow -Wait
          $probe = Get-Content $log -Raw
          Stop-Process -Id $mux.Id
          $probe -split "`n" | Select-String 'DOMAIN'
          if ($probe -notmatch "DOMAIN gui-$($mux.Id)\b") { throw "gui-$($mux.Id) 도메인 없음" }
          if ($probe -match 'DOMAIN gui-99999') { throw '끝난 PID 도메인이 남음' }

      # 이하 실제 설치와 검증은 두 레그 모두 실행한다
      - name: winget 확인
        run: winget --version

      # README의 안내 명령 그대로 (Windows PowerShell 5.1)
      - name: 설치 (README 명령, Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        run: powershell -ExecutionPolicy Bypass -File .\install.ps1 -Yes

      - name: 설치 (PowerShell 7)
        if: matrix.shell == 'pwsh'
        run: pwsh -File .\install.ps1 -Yes

      - name: 이후 단계용 PATH 갱신
        run: |
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          foreach ($p in ($machine + ';' + $user).Split(';')) {
              if ($p) { Add-Content -Path $env:GITHUB_PATH -Value $p }
          }

      - name: Lua spec
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem tests/lua/*_spec.lua) {
              nvim --headless -u NONE -l $f.FullName
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "FAIL $($f.Name)"
                  $failed = $true
              } else {
                  Write-Host "PASS $($f.Name)"
              }
          }
          if ($failed) { exit 1 }

      - name: nvim 0.11 확인
        run: |
          nvim --headless "+lua assert(vim.fn.has('nvim-0.11')==1)" +qa
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: treesitter 스모크
        run: |
          nvim --headless tests/lua/paths_spec.lua "+luafile tests/treesitter_smoke.lua"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 시작 스모크
        run: |
          nvim --headless tests/fixtures/smoke.c "+luafile tests/startup_smoke.lua"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # headless에서는 자동 설치를 하지 않으므로 끝날 때까지 기다리는 MasonInstall로 설치한다
      - name: 디버그 어댑터 설치
        timeout-minutes: 5
        run: nvim --headless "+MasonInstall debugpy codelldb" +qa

      - name: Python 디버거 E2E
        timeout-minutes: 5
        run: |
          nvim --headless tests/fixtures/dap/hello.py "+luafile tests/dap_e2e.lua"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # zig cc로 컴파일한다 (PDB 생성, codelldb가 msdia140.dll로 읽음)
      - name: C 디버거 E2E
        timeout-minutes: 5
        run: |
          nvim --headless tests/fixtures/dap/hello.c "+luafile tests/dap_e2e.lua"
          if ($LASTEXITCODE -ne 0) { exit 1 }
